<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Pace — Build your credit{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body
  class="{% block body_class %}{% endblock %}"
  data-api-dashboard="{{ url_for('api_dashboard') }}"
  data-api-eligibility="{{ url_for('api_eligibility_get') }}"
  data-api-insights="{{ url_for('api_insights') }}"
  data-api-eligibility-recompute="{{ url_for('api_eligibility_post') }}"
>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
